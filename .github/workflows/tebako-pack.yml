name: tebako-pack

# Packs fontist into one self-contained executable per platform with
# tebako v2, wraps the Linux ones into .deb/.rpm packages, checks both on
# machines with no Ruby, and attaches them to the GitHub Release when given
# a tag.

on:
  # Called by release.yml once the gem is out. Its releases are created with
  # GITHUB_TOKEN, and GitHub starts no workflow from such an event, so a
  # `release: published` trigger here would never fire.
  workflow_call:
    inputs:
      publish:
        type: boolean
        default: true
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build and attach to (empty = build only)
        required: false
        default: ''
  pull_request:
    paths:
      - .github/workflows/tebako-pack.yml
      - script/tebako/**
      - packaging/**

permissions:
  contents: read

concurrency:
  group: '${{ github.workflow }}-${{ github.head_ref || github.ref_name }}'
  cancel-in-progress: true

env:
  # Ruby the packed fontist runs on: a version tebako ships a runtime for
  # (tebako press rejects the rest).
  PACKAGE_RUBY_VERSION: 3.3.12
  TEBAKO_VERSION: 2.8.68
  NFPM_VERSION: 2.48.0

jobs:
  resolve:
    name: resolve tag
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      # After release.yml the default branch carries the released version.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - id: tag
        env:
          GH_TOKEN: ${{ github.token }}
          # A called workflow sees the caller's event (release.yml runs on
          # workflow_dispatch), so tell the triggers apart by their inputs:
          # only workflow_call has `publish`, only workflow_dispatch has `tag`.
          CALLED: ${{ inputs.publish == true }}
          INPUT_TAG: ${{ inputs.tag || '' }}
        run: |
          if [ "$CALLED" = true ]; then
            tag="v$(sed -n 's/.*VERSION = "\(.*\)".*/\1/p' lib/fontist/version.rb)"
          else
            tag="$INPUT_TAG"
          fi
          if [ -n "$tag" ]; then
            # Only a version tag that is a published release of this repo.
            if ! printf '%s' "$tag" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "not a release tag: $tag" >&2
              exit 1
            fi
            gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json tagName >/dev/null
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "building ${tag:-$GITHUB_SHA}"

  pack:
    name: pack ${{ matrix.name }}
    needs: resolve
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux is packed on the oldest runner so the result runs on older
          # glibc distros too.
          - { os: ubuntu-22.04,     triplet: linux-gnu-x86_64, name: linux-x86_64 }
          - { os: ubuntu-22.04-arm, triplet: linux-gnu-arm64,  name: linux-arm64 }
          - { os: macos-15,         triplet: macos-arm64,      name: macos-arm64 }
          - { os: macos-15-intel,   triplet: macos-x86_64,     name: macos-x86_64 }
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # A release build packs the validated release tag, not the dispatching
      # commit (release.yml bumps the version after this run's commit).
      - name: Check out the release tag
        if: needs.resolve.outputs.tag != ''
        env:
          TAG: ${{ needs.resolve.outputs.tag }}
        run: git checkout --detach "refs/tags/$TAG"

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      - name: Press
        env:
          GH_TOKEN: ${{ github.token }}
        run: script/tebako/press.sh "${{ matrix.triplet }}" "out/fontist-${{ matrix.name }}"

      # Uploaded before the smoke test so a failing binary can be fetched
      # and inspected.
      - uses: actions/upload-artifact@v4
        with:
          name: fontist-${{ matrix.name }}
          path: out/fontist-${{ matrix.name }}
          if-no-files-found: error

      # Only the system directories and git stay on PATH, so the Ruby set up
      # above is out of reach. (macOS keeps a system ruby in /usr/bin; the
      # fresh distro containers in package-smoke are the no-Ruby-at-all
      # check.) fontist's git gem needs git >= 2.43, newer than Apple's, so
      # the runner's own git is kept.
      - name: Smoke test without the build Ruby
        run: |
          git_dir="$(dirname "$(command -v git)")"
          env -i HOME="$HOME" PATH="$git_dir:/usr/bin:/bin:/usr/sbin:/sbin" \
            script/tebako/smoke.sh "out/fontist-${{ matrix.name }}"

  packages:
    name: deb and rpm
    needs: [ resolve, pack ]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # A release build packs the validated release tag, not the dispatching
      # commit (release.yml bumps the version after this run's commit).
      - name: Check out the release tag
        if: needs.resolve.outputs.tag != ''
        env:
          TAG: ${{ needs.resolve.outputs.tag }}
        run: git checkout --detach "refs/tags/$TAG"

      - uses: actions/download-artifact@v4
        with:
          pattern: fontist-linux-*
          path: out
          merge-multiple: true

      - name: Install nfpm
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "v${NFPM_VERSION}" --repo goreleaser/nfpm --dir /tmp/nfpm \
            --pattern "nfpm_${NFPM_VERSION}_Linux_x86_64.tar.gz" --pattern checksums.txt
          (cd /tmp/nfpm && sha256sum --ignore-missing -c checksums.txt)
          tar -xzf "/tmp/nfpm/nfpm_${NFPM_VERSION}_Linux_x86_64.tar.gz" -C /tmp/nfpm nfpm
          sudo install /tmp/nfpm/nfpm /usr/local/bin/nfpm

      - name: Build packages
        run: |
          script/tebako/package.sh amd64 out/fontist-linux-x86_64 pkg
          script/tebako/package.sh arm64 out/fontist-linux-arm64 pkg

      - uses: actions/upload-artifact@v4
        with:
          name: fontist-linux-packages
          path: pkg/*
          if-no-files-found: error

  package-smoke:
    name: install on ${{ matrix.image }} ${{ matrix.arch }}
    needs: [ resolve, packages ]
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        # Distros whose git meets the git gem's >= 2.43; older ones refuse
        # the package on its git dependency.
        # ubuntu:22.04 ships an older git and first gets a newer one the
        # documented way (git-prep.sh, see README.adoc). debian:12 has no leg:
        # bookworm-backports carries no git package, so no >= 2.43 exists there.
        image: [ 'ubuntu:24.04', 'debian:13', 'fedora:latest', 'rockylinux:9', 'ubuntu:22.04' ]
        arch: [ amd64 ]
        runner: [ ubuntu-24.04 ]
        include:
          - { image: 'ubuntu:24.04', arch: arm64, runner: ubuntu-24.04-arm }
    steps:
      # Only the smoke scripts are used here, so the dispatching commit is
      # enough (these containers have no git to check out a tag with).
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: fontist-linux-packages
          path: pkg

      - name: Keep only this architecture
        run: |
          if [ "${{ matrix.arch }}" = amd64 ]; then
            find pkg \( -name '*arm64*' -o -name '*aarch64*' \) -delete
          else
            find pkg \( -name '*amd64*' -o -name '*x86_64*' \) -delete
          fi
          ls -l pkg

      - name: Get git 2.43 or newer
        if: matrix.image == 'ubuntu:22.04'
        run: script/tebako/git-prep.sh

      - name: Install, use, remove
        run: script/tebako/package-smoke.sh pkg

  # Test-only: the packed executables again, on runners other than the ones
  # that packed them. No macOS leg: macos-14 is not offered to this repo
  # (run 42989415969: "The configuration 'macos-14-arm64-us-default' is not
  # supported") and macos-13 is a label GitHub has retired; the macOS
  # binaries are smoke-tested on their packing runners in `pack`.
  binary-smoke:
    name: run ${{ matrix.name }} on ${{ matrix.os }}
    needs: pack
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, name: linux-x86_64 }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: fontist-${{ matrix.name }}
          path: out

      - name: Smoke test
        run: |
          chmod +x "out/fontist-${{ matrix.name }}"
          git_dir="$(dirname "$(command -v git)")"
          env -i HOME="$HOME" PATH="$git_dir:/usr/bin:/bin:/usr/sbin:/sbin" \
            script/tebako/smoke.sh "out/fontist-${{ matrix.name }}"

  publish:
    name: attach to release
    if: needs.resolve.outputs.tag != ''
    needs: [ resolve, pack, package-smoke, binary-smoke ]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Name executables by version and upload
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          version="${TAG#v}"
          cd dist
          for name in linux-x86_64 linux-arm64 macos-arm64 macos-x86_64; do
            mv "fontist-$name" "fontist-$version-$name"
          done
          # Executables and .rpm files are fontist-*, .deb files fontist_*.
          sha256sum fontist-* fontist_* > SHA256SUMS
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber \
            fontist-* fontist_* SHA256SUMS
